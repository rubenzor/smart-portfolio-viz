services:
  - name: quint-backend
    type: web
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: SQLITE_PATH
        value: /app/data/tfg.db
      - key: REDIS_HOST
        fromService:
          name: quint-redis
          property: host
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        fromService:
          name: quint-redis
          property: password

  - name: quint-frontend
    type: web
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile.frontend
    envVars:
      - key: BACKEND_URL
        value: https://quint-backend.onrender.com   # Luego se reemplaza con la URL real

databases:
  - name: quint-redis
    plan: free
    databaseName: redis
    user: default
    type: redis