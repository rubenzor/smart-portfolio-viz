version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tfg_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app          # HOT RELOAD BACKEND
      - ./backend/data:/app/data   # SQLite persistente (opcional)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tfg_frontend
    ports:
      - "8050:8050"
    environment:
      - API_BASE=http://backend:8000/api/v1
    volumes:
      - ./frontend:/app         # HOT RELOAD FRONTEND
    command: python app.py
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: tfg_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
